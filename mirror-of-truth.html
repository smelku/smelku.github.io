        <div class="modal" onclick="closeModal()">
            <div class="close-btn" onclick="closeModal()">CLOSE</div>
            <img id="modalImage" src="" alt="Modal Image" />
            <!-- Add left and right half divs -->
            <div
                class="left-half"
                onclick="changeModalImage(-1); event.stopPropagation();"
            ></div>
            <div
                class="right-half"
                onclick="changeModalImage(1); event.stopPropagation();"
            ></div>
            <div
                class="arrow-btn prev-btn"
                onclick="changeModalImage(-1); event.stopPropagation();"
            >
                &#9753;
            </div>
            <div
                class="arrow-btn next-btn"
                onclick="changeModalImage(1); event.stopPropagation();"
            >
                &#10087;
            </div>
        </div>

        <script>
            const images = document.querySelectorAll(".gallery img");
            let currentImageIndex = 0;

            function openModal(imgElement) {
                const modal = document.querySelector(".modal");
                const modalImage = document.getElementById("modalImage");

                modal.style.display = "block";
                modalImage.src = imgElement.src;
                currentImageIndex = Array.from(images).indexOf(imgElement);
                setTimeout(() => modal.classList.add("active"), 10);
            }

            function closeModal() {
                const modal = document.querySelector(".modal");
                modal.classList.remove("active");
                setTimeout(() => {
                    modal.style.display = "none";
                }, 200);
            }

            function changeModalImage(direction) {
                currentImageIndex += direction;
                if (currentImageIndex >= images.length) {
                    currentImageIndex = 0;
                } else if (currentImageIndex < 0) {
                    currentImageIndex = images.length - 1;
                }
                document.getElementById("modalImage").src =
                    images[currentImageIndex].src;
            }
        </script>
