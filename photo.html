    <body>
        <article>
            <header>
                <div class="header-left">
                    <img class="header-left" src="./images/footer.png" />
                </div>
                <div class="header-right">
                    <h1 align="right">nav</h1>
                    <p>
                        <a href="./index.html">home</a> |

            <p align="right">
                <a href="javascript:history.back()">return</a>

        </article>
        <h1 align="center">playing attention (2018-2025)</h1>
        <div class="gallery">
            <img
                src="./images/gallery/path_to_image1.jpg"
                alt="Image 1"
                data-title="Lucky Boy"
                data-description="Pasadena, CA"
                onclick="openModal(this)"
                loading="lazy"
            />
            <img
                src="./images/gallery/path_to_image2.jpg"
                alt="Image 2"
                data-title="Palm Springs"
                data-description="Palm Springs, CA"
                onclick="openModal(this)"
                loading="lazy"
            />
            <img
                src="./images/gallery/path_to_image3.jpg"
                alt="Image 3"
                onclick="openModal(this)"
                loading="lazy"
            />
            <img
                src="./images/gallery/path_to_image4.png"
                alt="Image 4"
                onclick="openModal(this)"
                loading="lazy"
            />
            <img
                src="./images/gallery/path_to_image5.png"
                alt="Image 5"
                onclick="openModal(this)"
                loading="lazy"
            />
            <img
                src="./images/gallery/path_to_image6.png"
                alt="Image 6"
                onclick="openModal(this)"
                loading="lazy"
            />
            <!-- Add more images here as needed -->
        </div>

        <div class="modal" onclick="closeModal()">
            <div class="close-btn" onclick="closeModal()">CLOSE</div>
            <img id="modalImage" src="" alt="Modal Image" />
            <!-- Add left and right half divs -->
            <div
                class="left-half"
                onclick="changeModalImage(-1); event.stopPropagation();"
            ></div>
            <div
                class="right-half"
                onclick="changeModalImage(1); event.stopPropagation();"
            ></div>
            <div
                class="arrow-btn prev-btn"
                onclick="changeModalImage(-1); event.stopPropagation();"
            >
                &#9753;
            </div>
            <div
                class="arrow-btn next-btn"
                onclick="changeModalImage(1); event.stopPropagation();"
            >
                &#10087;
            </div>
            <!-- New: Add a container for title and description -->
            <div id="modalCaption">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
            </div>
        </div>

        <script>
            const images = document.querySelectorAll(".gallery img");
            let currentImageIndex = 0;

            function openModal(imgElement) {
                const modal = document.querySelector(".modal");
                const modalImage = document.getElementById("modalImage");
                const modalTitle = document.getElementById("modalTitle");
                const modalDescription =
                    document.getElementById("modalDescription");

                modal.style.display = "block";
                modalImage.src = imgElement.src;
                // New: Populate title and description from data attributes
                modalTitle.textContent = imgElement.dataset.title || "No Title";
                modalDescription.textContent =
                    imgElement.dataset.description || "";
                currentImageIndex = Array.from(images).indexOf(imgElement);
                setTimeout(() => modal.classList.add("active"), 10);
            }

            function closeModal() {
                const modal = document.querySelector(".modal");
                modal.classList.remove("active");
                setTimeout(() => {
                    modal.style.display = "none";
                }, 200);
            }

            function changeModalImage(direction) {
                currentImageIndex += direction;
                if (currentImageIndex >= images.length) {
                    currentImageIndex = 0;
                } else if (currentImageIndex < 0) {
                    currentImageIndex = images.length - 1;
                }
                const newImage = images[currentImageIndex];
                document.getElementById("modalImage").src = newImage.src;
                // New: Update title and description on navigation
                document.getElementById("modalTitle").textContent =
                    newImage.dataset.title || "Untitled";
                document.getElementById("modalDescription").textContent =
                    newImage.dataset.description || "";
            }
        </script>

        <footer>
            <p class="footer">76°05'40.5"N 60°09'41.9"E</p>
        </footer>
    </body>
</html>
